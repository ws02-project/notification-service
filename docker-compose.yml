version: '3.8'

services:
  notification-service-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: notification-service-dev
    ports:
      - '3002:3002'
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:delegated
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./.env:/app/.env:ro
      # Mount shared proto files
      - ../proto:/app/proto:ro
    environment:
      - NODE_ENV=development
      - PORT=3002
    command: pnpm dev:container
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3002/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  notification-service-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-service-prod
    ports:
      - '3003:3002'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3002/api/v1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production

