name: Notification Service CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  repository_dispatch:
    types: [proto-updated]

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 158670175038.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY: docker
  SERVICE_NAME: notification-service

permissions:
  id-token: write
  contents: write

jobs:
  # ============================================
  # Test Job
  # ============================================
  test:
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Run tests
        run: pnpm exec jest --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: notification-service-coverage
          fail_ci_if_error: false

  # ============================================
  # Build and Push Docker Image
  # ============================================
  build-and-push:
    runs-on: ubuntu-latest
    name: Build and Push Docker Image
    needs: test
    if: needs.test.result == 'success'
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      new_version: ${{ steps.version.outputs.new_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout proto repository
        uses: actions/checkout@v4
        with:
          repository: ws02-project/proto
          path: proto
          token: ${{ secrets.PAT_TOKEN }}

      - name: Calculate next version
        id: version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: master,main
          dry_run: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          # Use service-prefixed tags to avoid collisions in shared ECR repo
          if [[ -n "${{ steps.version.outputs.new_tag }}" ]]; then
            VERSION_TAG="${{ steps.version.outputs.new_tag }}"
            IMAGE_TAG="${{ env.SERVICE_NAME }}-${VERSION_TAG}"
            IS_RELEASE="true"
          elif [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            IMAGE_TAG="${{ env.SERVICE_NAME }}-proto-${GITHUB_SHA::8}"
            IS_RELEASE="false"
          else
            IMAGE_TAG="${{ env.SERVICE_NAME }}-dev-${GITHUB_SHA::8}"
            IS_RELEASE="false"
          fi

          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_latest=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.SERVICE_NAME }}-latest" >> $GITHUB_OUTPUT

          echo "## 🏷️ Image Tag: \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY

      - name: Install dependencies for Trivy scan
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile || pnpm install

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Build Docker image
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image }}
        run: |
          echo "Building Docker image: $IMAGE_NAME"
          docker build -t $IMAGE_NAME -f Dockerfile .
          docker tag $IMAGE_NAME ${{ steps.meta.outputs.image_latest }}
          docker tag $IMAGE_NAME ${{ env.SERVICE_NAME }}:scan

      - name: Run Trivy image scan (Show all vulnerabilities)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: '${{ env.SERVICE_NAME }}:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'

      - name: Run Trivy image scan (Fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ env.SERVICE_NAME }}:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Push Docker image to ECR
        env:
          IMAGE_NAME: ${{ steps.meta.outputs.image }}
          IMAGE_LATEST: ${{ steps.meta.outputs.image_latest }}
        run: |
          echo "Pushing Docker image: $IMAGE_NAME"
          docker push $IMAGE_NAME
          docker push $IMAGE_LATEST

      - name: Image details
        run: |
          echo "✅ Successfully pushed image:"
          echo "  Image: ${{ steps.meta.outputs.image }}"
          echo "  Latest: ${{ steps.meta.outputs.image_latest }}"

  # ============================================
  # Create Release (only after successful build)
  # ============================================
  release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: build-and-push
    if: |
      needs.build-and-push.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: master,main

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: |
            ${{ steps.tag.outputs.changelog }}

            **Docker Image:** `${{ needs.build-and-push.outputs.image_tag }}`
          generate_release_notes: true

      - name: Release Output
        run: |
          echo "## 🎉 Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.tag.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.tag.outputs.new_tag }}" >> $GITHUB_STEP_SUMMARY

      - name: Get commit message
        id: commit
        run: |
          PARENT_COUNT=$(git cat-file -p HEAD | grep -c "^parent")
          if [ "$PARENT_COUNT" -gt 1 ]; then
            COMMIT_MSG=$(git log -1 --pretty=%s HEAD^2 2>/dev/null || git log -1 --pretty=%s)
          else
            COMMIT_MSG=$(git log -1 --pretty=%s)
          fi
          COMMIT_MSG=$(echo "$COMMIT_MSG" | head -c 100)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Trigger deployment update
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: ws02-project/deployments
          event-type: update-image
          client-payload: |-
            {
              "service": "notification-service",
              "image_tag": "${{ needs.build-and-push.outputs.image_tag }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": "${{ steps.commit.outputs.message }}",
              "version": "${{ steps.tag.outputs.new_version }}",
              "is_release": true
            }
